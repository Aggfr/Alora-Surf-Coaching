name: Storybook

on:
  push:
    branches: [main]
    paths: ['design-system/**', 'storybook/**', '.github/workflows/storybook.yml']
  pull_request:
    paths: ['design-system/**', 'storybook/**', '.github/workflows/storybook.yml']
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Regenerate the visual baselines and commit them to this branch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Only used to commit visual baselines when update-snapshots is requested.
      contents: write
    defaults:
      run:
        working-directory: storybook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storybook/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build-storybook
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Accessibility and visual tests (every story, both themes)
        run: npm run test:visual -- ${{ inputs.update-snapshots && '--update-snapshots' || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            storybook/playwright-report
            storybook/test-results
          retention-days: 14
      - name: Commit updated baselines
        if: inputs.update-snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/__screenshots__
          git diff --cached --quiet || git commit -m 'Update visual baselines' && git push
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: storybook/storybook-static

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
